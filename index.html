<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AttendHub · Home</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">
    <div id="app-header"></div>
    <div id="role-banner"></div>

    <section class="guide">
      <article>
        <h3>👑 Manager</h3>
        <p>Sees every check-in and check-out for all 30 employees plus their own card.</p>
      </article>
      <article>
        <h3>⭐ Supervisor</h3>
        <p>Sees only people in the same department (Sales, Operations, IT, or Support).</p>
      </article>
      <article>
        <h3>👤 Staff</h3>
        <p>Sees only their own punches. Switch roles at the top right to try each view.</p>
      </article>
    </section>

    <div id="dash"></div>
    <div id="app-footer"></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
